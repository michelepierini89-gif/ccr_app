name: ccr_app
description: "CCR - Coppa Canta Rally App"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.5
  flutter_riverpod: ^2.6.1
